name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Smoke (PHP lint + build)
        run: bash scripts/smoke.sh

      - name: Jest unit tests
        run: npx wp-scripts test-unit-js --ci

      - name: PHP settings sanitizer test
        run: php tests/php/settings-sanitize.test.php

      - name: PHP uninstall options test
        run: php tests/php/uninstall-options.test.php
